openapi: 3.0.3
info:
  title: Meeting Room Booking Service API
  description: |
    REST API сервиса бронирования переговорных комнат.

    ## Роли
    - **admin** — полный доступ ко всем операциям, включая CRUD комнат
      и отмену любого бронирования.
    - **manager** — может отменять чужие бронирования на своём этаже.
    - **member** — может создавать и отменять только собственные бронирования.

    ## Бизнес-правила
    - Бронирование невозможно, если комната уже занята в запрошенный интервал
      (HTTP 409).
    - Длительность бронирования: минимум 15 минут, максимум 8 часов
      (HTTP 400 при нарушении).
    - Отмена возможна не позднее чем за 30 минут до начала (HTTP 409).
    - Все временные метки в формате RFC 3339 (UTC), например
      `2026-05-19T10:00:00Z`.
  version: 1.0.0
  contact:
    name: Booking Engine Team
    email: api@booking-engine.example.com

servers:
  - url: https://api.booking-engine.example.com/v1
    description: Production
  - url: https://staging.api.booking-engine.example.com/v1
    description: Staging

security:
  - bearerAuth: []

tags:
  - name: Rooms
    description: Управление переговорными комнатами
  - name: Bookings
    description: Управление бронированиями
  - name: Waitlist
    description: Лист ожидания на занятые интервалы комнат
  - name: Users
    description: Пользовательские операции

paths:
  /rooms:
    get:
      tags: [Rooms]
      summary: Список всех комнат
      description: Возвращает список комнат. Доступно всем аутентифицированным пользователям.
      operationId: listRooms
      parameters:
        - name: floor
          in: query
          description: Фильтр по этажу
          required: false
          schema:
            type: integer
            example: 3
        - name: min_capacity
          in: query
          description: Минимальная вместимость
          required: false
          schema:
            type: integer
            minimum: 1
            example: 4
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Список комнат
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
                  total:
                    type: integer
                    example: 12
              examples:
                default:
                  value:
                    items:
                      - id: "r-001"
                        name: "Эверест"
                        capacity: 10
                        floor: 3
                        equipment: [projector, whiteboard]
                        status: active
                      - id: "r-002"
                        name: "Килиманджаро"
                        capacity: 6
                        floor: 3
                        equipment: [video_conf]
                        status: active
                    total: 2
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Rooms]
      summary: Создать комнату
      description: Только для пользователей с ролью `admin`.
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreate'
            examples:
              default:
                value:
                  name: "Эльбрус"
                  capacity: 8
                  floor: 4
                  equipment: [projector, video_conf]
      responses:
        '201':
          description: Комната создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /rooms/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'

    get:
      tags: [Rooms]
      summary: Получить комнату
      operationId: getRoom
      responses:
        '200':
          description: Комната
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Rooms]
      summary: Обновить комнату
      description: Только для `admin`.
      operationId: updateRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomUpdate'
      responses:
        '200':
          description: Обновлённая комната
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Rooms]
      summary: Удалить комнату
      description: Только для `admin`. Удаление невозможно, если у комнаты есть будущие бронирования со статусом `confirmed`.
      operationId: deleteRoom
      responses:
        '204':
          description: Комната удалена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: У комнаты есть активные бронирования
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    code: ROOM_HAS_ACTIVE_BOOKINGS
                    message: "Невозможно удалить комнату: есть 3 будущих подтверждённых бронирования"

  /rooms/available:
    get:
      tags: [Rooms]
      summary: Поиск доступных комнат
      description: |
        Возвращает комнаты, свободные в указанном временном интервале
        и удовлетворяющие фильтрам.
      operationId: searchAvailableRooms
      parameters:
        - name: start
          in: query
          required: true
          description: Начало интервала (RFC 3339, UTC)
          schema:
            type: string
            format: date-time
            example: "2026-05-19T10:00:00Z"
        - name: end
          in: query
          required: true
          description: Конец интервала (RFC 3339, UTC)
          schema:
            type: string
            format: date-time
            example: "2026-05-19T11:00:00Z"
        - name: capacity_min
          in: query
          required: false
          description: Минимальная вместимость
          schema:
            type: integer
            minimum: 1
            example: 4
        - name: floor
          in: query
          required: false
          schema:
            type: integer
        - name: equipment
          in: query
          required: false
          description: Необходимое оборудование (массив, повторяемый параметр)
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Equipment'
          style: form
          explode: true
      responses:
        '200':
          description: Список доступных комнат
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
              examples:
                default:
                  value:
                    - id: "r-001"
                      name: "Эверест"
                      capacity: 10
                      floor: 3
                      equipment: [projector, whiteboard]
                      status: active
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rooms/{id}/bookings:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Rooms]
      summary: Бронирования конкретной комнаты
      description: Список бронирований комнаты за указанную дату (UTC).
      operationId: listRoomBookings
      parameters:
        - name: date
          in: query
          required: true
          description: Дата в формате YYYY-MM-DD (UTC)
          schema:
            type: string
            format: date
            example: "2026-05-19"
      responses:
        '200':
          description: Бронирования комнаты на указанную дату
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
              examples:
                default:
                  value:
                    - id: "b-100"
                      room_id: "r-001"
                      user_id: "u-42"
                      title: "Sprint Planning"
                      start_time: "2026-05-19T10:00:00Z"
                      end_time: "2026-05-19T11:00:00Z"
                      status: confirmed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rooms/{id}/availability:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Rooms]
      summary: Проверить доступность комнаты на интервал
      description: |
        Проверяет, свободна ли комната на интервале `[start_time, end_time)`, и
        возвращает пересекающиеся `confirmed` бронирования. `available` истинно, только
        если комната активна **и** пересечений нет: комната вне обслуживания недоступна
        для брони независимо от занятости. Доступно любому аутентифицированному
        пользователю; лимиты длительности брони здесь не применяются.
      operationId: checkRoomAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomAvailabilityCheck'
            examples:
              default:
                value:
                  start_time: "2026-05-19T10:00:00Z"
                  end_time: "2026-05-19T11:00:00Z"
      responses:
        '200':
          description: Результат проверки доступности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomAvailability'
              examples:
                available:
                  summary: Комната свободна
                  value:
                    available: true
                    conflicts: []
                busy:
                  summary: Комната занята
                  value:
                    available: false
                    conflicts:
                      - id: "b-87"
                        room_id: "r-001"
                        user_id: "u-42"
                        title: "Sprint Planning"
                        start_time: "2026-05-19T10:30:00Z"
                        end_time: "2026-05-19T11:30:00Z"
                        status: confirmed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rooms/{id}/stats:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Rooms]
      summary: Статистика бронирований комнаты
      description: Количество бронирований комнаты за последний месяц (окно `[period_start, period_end)`, любой статус).
      operationId: getRoomStats
      responses:
        '200':
          description: Статистика комнаты за последний месяц
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomStats'
              examples:
                default:
                  value:
                    room_id: "r-001"
                    period_start: "2026-04-19T08:00:00Z"
                    period_end: "2026-05-19T08:00:00Z"
                    booking_count: 12
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings:
    post:
      tags: [Bookings]
      summary: Создать бронирование
      description: |
        Создаёт бронирование комнаты. Сервер проверяет:
        - Существование комнаты.
        - Длительность от 15 минут до 8 часов.
        - Отсутствие пересечений с другими `confirmed` бронированиями.
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
            examples:
              default:
                value:
                  room_id: "r-001"
                  title: "Sprint Planning"
                  start_time: "2026-05-19T10:00:00Z"
                  end_time: "2026-05-19T11:00:00Z"
      responses:
        '201':
          description: Бронирование создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Невалидные данные (неправильный интервал, нарушение лимитов, пустые или слишком длинные поля)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                durationTooShort:
                  summary: Слишком короткое бронирование
                  value:
                    code: BOOKING_DURATION_TOO_SHORT
                    message: "Минимальная длительность бронирования — 15 минут"
                durationTooLong:
                  summary: Слишком длинное бронирование
                  value:
                    code: BOOKING_DURATION_TOO_LONG
                    message: "Максимальная длительность бронирования — 8 часов"
                invalidRange:
                  summary: Некорректный временной интервал
                  value:
                    code: INVALID_TIME_RANGE
                    message: "end_time должен быть позже start_time"
                startInPast:
                  summary: Начало брони в прошлом
                  value:
                    code: START_IN_PAST
                    message: "start_time должен быть в будущем"
                validation:
                  summary: Пустое или слишком длинное поле (room_id, title)
                  value:
                    code: VALIDATION_ERROR
                    message: "title не должен превышать 200 символов"
                    details:
                      field: title
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Комната не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    code: ROOM_NOT_FOUND
                    message: "Комната с id 'r-999' не найдена"
        '409':
          description: Конфликт — комната занята в этом интервале или выведена из обслуживания
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                conflict:
                  summary: Интервал уже занят другой бронью
                  value:
                    code: BOOKING_CONFLICT
                    message: "Комната уже забронирована в указанный интервал"
                    details:
                      conflicting_booking_id: "b-87"
                      conflicting_start: "2026-05-19T10:30:00Z"
                      conflicting_end: "2026-05-19T11:30:00Z"
                outOfService:
                  summary: Комната выведена из обслуживания
                  value:
                    code: ROOM_OUT_OF_SERVICE
                    message: "Комната недоступна для бронирования"
        '500':
          $ref: '#/components/responses/InternalError'

  /bookings/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [Bookings]
      summary: Отменить бронирование
      description: |
        Правила доступа:
        - Автор бронирования может отменить только своё бронирование.
        - `manager` может отменять чужие бронирования **на своём этаже**.
        - `admin` может отменять любое бронирование.

        Отмена возможна не позднее чем за 30 минут до `start_time`.

        Побочный эффект: при отмене система в той же транзакции предлагает
        освободившийся слот первой (по `position`) записи листа ожидания на
        пересекающийся интервал — её статус меняется на `offered`.
      operationId: cancelBooking
      responses:
        '200':
          description: Бронирование отменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                default:
                  value:
                    id: "b-100"
                    room_id: "r-001"
                    user_id: "u-42"
                    title: "Sprint Planning"
                    start_time: "2026-05-19T10:00:00Z"
                    end_time: "2026-05-19T11:00:00Z"
                    status: cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Недостаточно прав для отмены этого бронирования
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    code: CANCEL_FORBIDDEN
                    message: "Manager может отменять чужие бронирования только на своём этаже"
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Конфликт состояния — нельзя отменить
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooLate:
                  summary: Поздно отменять
                  value:
                    code: CANCEL_TOO_LATE
                    message: "Отмена невозможна позднее чем за 30 минут до начала"
                alreadyCancelled:
                  summary: Уже отменено
                  value:
                    code: BOOKING_ALREADY_CANCELLED
                    message: "Бронирование уже отменено"

  /bookings/{id}/force:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    delete:
      tags: [Bookings]
      summary: Принудительно отменить бронирование (admin)
      description: |
        Принудительная отмена бронирования администратором.

        Отличия от обычной отмены (`POST /bookings/{id}/cancel`):
        - Доступно **только роли `admin`** — не владельцу и не менеджеру этажа.
        - Правило «не позднее чем за 30 минут до `start_time`» **не применяется**:
          admin может отменить бронь в любой момент, в том числе уже начавшуюся.

        Побочный эффект тот же, что у обычной отмены: в той же транзакции
        освободившийся слот предлагается первой (по `position`) записи листа
        ожидания на пересекающийся интервал — её статус меняется на `offered`.
      operationId: forceCancelBooking
      responses:
        '204':
          description: Бронирование принудительно отменено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Принудительная отмена доступна только администратору
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    code: FORBIDDEN
                    message: "operation not allowed for your role"
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Бронирование уже отменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyCancelled:
                  value:
                    code: BOOKING_ALREADY_CANCELLED
                    message: "Бронирование уже отменено"

  /rooms/{id}/waitlist:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Waitlist]
      summary: Встать в очередь (лист ожидания)
      description: |
        Ставит пользователя в лист ожидания на интервал комнаты. Запись создаётся,
        **только если комната занята** подтверждённой бронью в этом интервале; если
        комната свободна — вернётся `409 WAITLIST_ROOM_AVAILABLE` (нужно оформить
        обычную бронь). Интервал проходит те же проверки, что и обычное бронирование
        (длительность 15 минут – 8 часов, начало в будущем). `position` назначается
        автоматически и не редактируется.
      operationId: joinWaitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistJoin'
            examples:
              default:
                value:
                  start_time: "2026-05-19T10:00:00Z"
                  end_time: "2026-05-19T11:00:00Z"
      responses:
        '201':
          description: Запись листа ожидания создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Комната не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    code: ROOM_NOT_FOUND
                    message: "Комната с id 'r-999' не найдена"
        '409':
          description: Нельзя встать в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                roomAvailable:
                  summary: Комната свободна — нужна обычная бронь
                  value:
                    code: WAITLIST_ROOM_AVAILABLE
                    message: "Комната свободна в указанный интервал; оформите бронь"
                alreadyInWaitlist:
                  summary: Уже в очереди на этот интервал
                  value:
                    code: ALREADY_IN_WAITLIST
                    message: "У вас уже есть запись листа ожидания на этот интервал"
                outOfService:
                  summary: Комната вне обслуживания
                  value:
                    code: ROOM_OUT_OF_SERVICE
                    message: "Комната недоступна для бронирования"
    get:
      tags: [Waitlist]
      summary: Посмотреть очередь комнаты
      description: Возвращает записи листа ожидания комнаты, отсортированные по `position`.
      operationId: listWaitlist
      responses:
        '200':
          description: Очередь комнаты
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WaitlistEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /waitlist/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/WaitlistId'
    post:
      tags: [Waitlist]
      summary: Подтвердить предложенный слот
      description: |
        Подтверждает предложенный (`offered`) слот: создаёт обычное бронирование и
        переводит запись в `converted`. Подтверждать может только владелец записи.
        Таймаут проверяется здесь: если с момента предложения прошло больше 15 минут,
        запись переходит в `expired`, слот предлагается следующему, а запрос вернёт
        `409 OFFER_EXPIRED`.
      operationId: confirmWaitlist
      responses:
        '201':
          description: Слот подтверждён, создано бронирование
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Нельзя подтвердить — начало интервала уже наступило
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                startInPast:
                  value:
                    code: START_IN_PAST
                    message: "start_time уже наступил — слот подтвердить нельзя"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нельзя подтверждать чужую запись
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    code: WAITLIST_FORBIDDEN
                    message: "Нельзя изменять чужую запись листа ожидания"
        '404':
          description: Запись листа ожидания не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    code: WAITLIST_NOT_FOUND
                    message: "Запись листа ожидания не найдена"
        '409':
          description: Слот нельзя подтвердить
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notPending:
                  summary: Запись не в статусе offered
                  value:
                    code: OFFER_NOT_PENDING
                    message: "Запись листа ожидания не в статусе offered"
                expired:
                  summary: Предложение протухло
                  value:
                    code: OFFER_EXPIRED
                    message: "Срок подтверждения предложенного слота истёк"
                conflict:
                  summary: Интервал уже занят
                  value:
                    code: BOOKING_CONFLICT
                    message: "Комната уже забронирована в указанный интервал"
                outOfService:
                  summary: Комната выведена из обслуживания
                  value:
                    code: ROOM_OUT_OF_SERVICE
                    message: "Комната недоступна для бронирования"

  /waitlist/{id}:
    parameters:
      - $ref: '#/components/parameters/WaitlistId'
    delete:
      tags: [Waitlist]
      summary: Выйти из очереди
      description: |
        Удаляет запись листа ожидания. Удалять может владелец записи или `admin`.

        Побочный эффект: если снимается запись в статусе `offered`, освободившийся слот
        в той же транзакции предлагается следующей записи очереди (её статус → `offered`),
        чтобы выход из очереди не «подвешивал» слот.
      operationId: leaveWaitlist
      responses:
        '204':
          description: Запись удалена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нельзя удалять чужую запись
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    code: WAITLIST_FORBIDDEN
                    message: "Нельзя изменять чужую запись листа ожидания"
        '404':
          description: Запись листа ожидания не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    code: WAITLIST_NOT_FOUND
                    message: "Запись листа ожидания не найдена"

  /users/{id}/bookings:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Бронирования пользователя
      description: |
        Возвращает бронирования указанного пользователя.
        - `member` может смотреть только свои.
        - `manager`/`admin` могут смотреть чужие.
      operationId: listUserBookings
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BookingStatus'
        - name: from
          in: query
          required: false
          description: Фильтр — бронирования начиная с этой даты (UTC)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Список бронирований пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
              examples:
                default:
                  value:
                    - id: "b-100"
                      room_id: "r-001"
                      user_id: "u-42"
                      title: "Sprint Planning"
                      start_time: "2026-05-19T10:00:00Z"
                      end_time: "2026-05-19T11:00:00Z"
                      status: confirmed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RoomId:
      name: id
      in: path
      required: true
      description: Идентификатор комнаты
      schema:
        type: string
        example: "r-001"
    BookingId:
      name: id
      in: path
      required: true
      description: Идентификатор бронирования
      schema:
        type: string
        example: "b-100"
    WaitlistId:
      name: id
      in: path
      required: true
      description: Идентификатор записи листа ожидания
      schema:
        type: string
        example: "wl-100"
    UserId:
      name: id
      in: path
      required: true
      description: Идентификатор пользователя
      schema:
        type: string
        example: "u-42"

  schemas:
    Equipment:
      type: string
      description: Оборудование в комнате
      enum:
        - projector
        - whiteboard
        - video_conf
      example: projector

    Role:
      type: string
      description: Роль пользователя
      enum:
        - admin
        - manager
        - member
      example: member

    BookingStatus:
      type: string
      enum:
        - confirmed
        - cancelled
      example: confirmed

    RoomStatus:
      type: string
      description: |
        Статус комнаты: `active` — доступна для бронирования;
        `out_of_service` — выведена из обслуживания, бронировать нельзя.
      enum:
        - active
        - out_of_service
      example: active

    Room:
      type: object
      required: [id, name, capacity, floor, equipment, status]
      properties:
        id:
          type: string
          example: "r-001"
        name:
          type: string
          example: "Эверест"
        capacity:
          type: integer
          minimum: 1
          example: 10
        floor:
          type: integer
          example: 3
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/Equipment'
          example: [projector, whiteboard]
        status:
          $ref: '#/components/schemas/RoomStatus'

    RoomStats:
      type: object
      required: [room_id, period_start, period_end, booking_count]
      properties:
        room_id:
          type: string
          example: "r-001"
        period_start:
          type: string
          format: date-time
          description: Начало окна статистики (now − 1 месяц, UTC)
          example: "2026-04-19T08:00:00Z"
        period_end:
          type: string
          format: date-time
          description: Конец окна статистики (now, UTC)
          example: "2026-05-19T08:00:00Z"
        booking_count:
          type: integer
          minimum: 0
          description: Число бронирований, начавшихся в окне
          example: 12

    RoomCreate:
      type: object
      required: [name, capacity, floor]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Эльбрус"
        capacity:
          type: integer
          minimum: 1
          maximum: 1000
          example: 8
        floor:
          type: integer
          example: 4
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/Equipment'
          default: []
          example: [projector, video_conf]

    RoomUpdate:
      type: object
      description: Поля для обновления комнаты. Все поля опциональны.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        capacity:
          type: integer
          minimum: 1
          maximum: 1000
        floor:
          type: integer
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/Equipment'

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
          example: "u-42"
        name:
          type: string
          example: "Иван Петров"
        email:
          type: string
          format: email
          example: "ivan.petrov@example.com"
        role:
          $ref: '#/components/schemas/Role'

    Booking:
      type: object
      required: [id, room_id, user_id, title, start_time, end_time, status]
      properties:
        id:
          type: string
          example: "b-100"
        room_id:
          type: string
          example: "r-001"
        user_id:
          type: string
          example: "u-42"
        title:
          type: string
          example: "Sprint Planning"
        start_time:
          type: string
          format: date-time
          example: "2026-05-19T10:00:00Z"
        end_time:
          type: string
          format: date-time
          example: "2026-05-19T11:00:00Z"
        status:
          $ref: '#/components/schemas/BookingStatus'

    BookingCreate:
      type: object
      required: [room_id, title, start_time, end_time]
      properties:
        room_id:
          type: string
          example: "r-001"
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: "Sprint Planning"
        start_time:
          type: string
          format: date-time
          description: Начало бронирования (RFC 3339, UTC)
          example: "2026-05-19T10:00:00Z"
        end_time:
          type: string
          format: date-time
          description: Конец бронирования (RFC 3339, UTC). Длительность от 15 минут до 8 часов.
          example: "2026-05-19T11:00:00Z"

    RoomAvailabilityCheck:
      type: object
      required: [start_time, end_time]
      properties:
        start_time:
          type: string
          format: date-time
          description: Начало интервала (RFC 3339, UTC)
          example: "2026-05-19T10:00:00Z"
        end_time:
          type: string
          format: date-time
          description: Конец интервала (RFC 3339, UTC), эксклюзивная граница
          example: "2026-05-19T11:00:00Z"

    RoomAvailability:
      type: object
      required: [available, conflicts]
      properties:
        available:
          type: boolean
          description: Комната свободна на интервале (активна и без пересечений).
          example: true
        conflicts:
          type: array
          description: Пересекающиеся confirmed бронирования (пустой список, если их нет).
          items:
            $ref: '#/components/schemas/Booking'

    WaitlistStatus:
      type: string
      description: |
        Статус записи листа ожидания:
        `waiting` — в очереди; `offered` — слот предложен, ждёт подтверждения;
        `expired` — предложение протухло; `converted` — подтверждено, создана бронь.
      enum:
        - waiting
        - offered
        - expired
        - converted
      example: waiting

    WaitlistEntry:
      type: object
      required: [id, room_id, user_id, start_time, end_time, position, status, created_at]
      properties:
        id:
          type: string
          example: "wl-100"
        room_id:
          type: string
          example: "r-001"
        user_id:
          type: string
          example: "u-42"
        start_time:
          type: string
          format: date-time
          example: "2026-05-19T10:00:00Z"
        end_time:
          type: string
          format: date-time
          example: "2026-05-19T11:00:00Z"
        position:
          type: integer
          minimum: 1
          description: Порядковый номер в очереди комнаты (назначается автоматически)
          example: 1
        status:
          $ref: '#/components/schemas/WaitlistStatus'
        offered_at:
          type: string
          format: date-time
          nullable: true
          description: Момент предложения слота (заполнен только в статусе `offered`)
          example: "2026-05-19T09:30:00Z"
        created_at:
          type: string
          format: date-time
          example: "2026-05-19T08:00:00Z"

    WaitlistJoin:
      type: object
      required: [start_time, end_time]
      properties:
        start_time:
          type: string
          format: date-time
          description: Начало интервала (RFC 3339, UTC)
          example: "2026-05-19T10:00:00Z"
        end_time:
          type: string
          format: date-time
          description: Конец интервала (RFC 3339, UTC). Длительность от 15 минут до 8 часов.
          example: "2026-05-19T11:00:00Z"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
          example: BOOKING_CONFLICT
        message:
          type: string
          description: Человекочитаемое сообщение
          example: "Комната уже забронирована в указанный интервал"
        details:
          type: object
          description: Дополнительные данные об ошибке (произвольная структура)
          additionalProperties: true

  responses:
    BadRequest:
      description: Невалидные параметры запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                code: VALIDATION_ERROR
                message: "Параметр 'capacity_min' должен быть положительным числом"
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                code: UNAUTHORIZED
                message: "Требуется аутентификация"
    Forbidden:
      description: Нет прав на выполнение операции
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                code: FORBIDDEN
                message: "Операция доступна только пользователю с ролью admin"
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                code: NOT_FOUND
                message: "Запрашиваемый ресурс не найден"
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                code: INTERNAL
                message: "internal error"
